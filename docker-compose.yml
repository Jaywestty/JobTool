name: jobtool

x-backend-env: &backend-env
  JOBTOOL_APP_ENV: ${JOBTOOL_APP_ENV:-development}
  JOBTOOL_HTTP_ADDR: ":8080"
  JOBTOOL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  JOBTOOL_LOG_LEVEL: ${JOBTOOL_LOG_LEVEL:-info}
  JOBTOOL_WEB_ORIGIN: ${JOBTOOL_WEB_ORIGIN:-http://localhost:3000}
  JOBTOOL_ROLE_FAMILIES: ${JOBTOOL_ROLE_FAMILIES}
  JOBTOOL_EMBEDDING_PROVIDER: ${JOBTOOL_EMBEDDING_PROVIDER:-local}
  JOBTOOL_EMBEDDING_MODEL: ${JOBTOOL_EMBEDDING_MODEL:-local-hash-v1}
  JOBTOOL_EMBEDDING_DIM: ${JOBTOOL_EMBEDDING_DIM:-768}
  JOBTOOL_LLM_PROVIDER: ${JOBTOOL_LLM_PROVIDER:-none}
  JOBTOOL_LLM_BASE_URL: ${JOBTOOL_LLM_BASE_URL:-}
  JOBTOOL_LLM_API_KEY: ${JOBTOOL_LLM_API_KEY:-}
  JOBTOOL_LLM_MODEL: ${JOBTOOL_LLM_MODEL:-}
  JOBTOOL_LLM_TIMEOUT_S: ${JOBTOOL_LLM_TIMEOUT_S:-30}
  JOBTOOL_DIGEST_DEFAULT_FREQUENCY: ${JOBTOOL_DIGEST_DEFAULT_FREQUENCY:-weekly}
  JOBTOOL_DIGEST_SEND_HOUR: ${JOBTOOL_DIGEST_SEND_HOUR:-8}
  JOBTOOL_SOURCES_USER_AGENT: ${JOBTOOL_SOURCES_USER_AGENT:-jobtool/0.1}
  JOBTOOL_SOURCES_TIMEOUT_S: ${JOBTOOL_SOURCES_TIMEOUT_S:-30}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: ./backend
    command: ["--migrate"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    command: ["--role", "api"]
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: ./backend
    command: ["--role", "worker"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    command: ["--role", "scheduler"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
